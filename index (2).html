  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050505;
      --card: #0b0b0b;
      --card-hover: #111111;
      --border: rgba(255,255,255,.10);
      --border-hover: rgba(255,255,255,.25);
      --text: #ffffff;
      --muted: #8a8a8a;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      overflow-x: hidden;
    }

    /* Background */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255,255,255,.08),
          transparent 35%
        ),
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );
      background-size:
        auto,
        45px 45px,
        45px 45px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 85%
      );
    }

    /* Main */

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }

    .profile {
      width: min(620px, 100%);
      padding: 42px 30px 28px;
      background: rgba(8,8,8,.88);
      border: 1px solid var(--border);
      border-radius: 24px;
      text-align: center;
      box-shadow:
        0 30px 100px rgba(0,0,0,.65),
        inset 0 1px rgba(255,255,255,.03);
      backdrop-filter: blur(18px);
      animation: appear .7s ease-out;
    }

    /* Avatar */

    .avatar {
      width: 108px;
      height: 108px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(145deg, #181818, #070707);

      border: 1px solid rgba(255,255,255,.25);

      box-shadow:
        0 0 0 6px rgba(255,255,255,.025),
        0 0 45px rgba(255,255,255,.08);

      font-size: 40px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    /* Name */

    .name {
      font-size: clamp(38px, 9vw, 58px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
    }

    .username {
      margin-top: 11px;
      color: #777;
      font-size: 14px;
      letter-spacing: .5px;
    }

    /* Status */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 18px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.025);
      color: #aaa;
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,.7);
    }

    /* About */

    .about {
      margin: 27px auto 0;
      max-width: 470px;
      color: #aaa;
      font-size: 15px;
      line-height: 1.75;
    }

    .about strong {
      color: #fff;
    }

    /* Divider */

    .divider {
      width: 100%;
      height: 1px;
      margin: 30px 0 22px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.12),
        transparent
      );
    }

    /* Links */

    .links {
      display: grid;
      gap: 11px;
    }

    .link {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      color: #fff;
      text-decoration: none;

      background: #0c0c0c;
      border: 1px solid var(--border);
      border-radius: 13px;

      font-size: 14px;
      font-weight: 600;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: var(--border-hover);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    .link:active {
      transform: translateY(0);
    }

    .link-icon {
      position: absolute;
      left: 18px;
      width: 20px;
      height: 20px;
      opacity: .85;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Footer */

    .footer {
      margin-top: 27px;
      color: #444;
      font-size: 11px;
      letter-spacing: .5px;
    }

    /* Animation */

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(22px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Mobile */

    @media (max-width: 600px) {
      .page {
        padding: 18px 12px;
        align-items: flex-start;
        padding-top: 30px;
      }

      .profile {
        padding: 34px 18px 24px;
        border-radius: 20px;
      }

      .avatar {
        width: 92px;
        height: 92px;
        font-size: 34px;
      }

      .name {
        font-size: 40px;
        letter-spacing: -2px;
      }

      .about {
        font-size: 14px;
      }

      .link {
        min-height: 54px;
      }
    }
  </style>
</head>
